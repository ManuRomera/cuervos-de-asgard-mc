name: Compatibilidad V13 y V14
on:
  push:
    branches: [main, feat/foundry-v13-v14]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find module -name '*.mjs' -print0)
      - name: Pruebas de compatibilidad
        run: node --test tests/*.test.mjs
